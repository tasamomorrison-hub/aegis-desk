name: AEGIS engine

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # every 15 min, covers 9:00-17:00 New York in summer and winter
    - cron: "30 22 * * 5"          # Friday evening: refresh the backtest
  workflow_dispatch:                # the dashboard's Controls button lands here
    inputs:
      action:
        description: "What should the engine do?"
        type: choice
        options: [cycle, evaluate, pause, resume, reset, backtest]
        default: cycle
  push:
    branches: [main]
    paths: ["web/**", "aegis/**", ".github/workflows/aegis.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aegis
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh backtest
        if: github.event.schedule == '30 22 * * 5' || inputs.action == 'backtest' || hashFiles('state/backtest.json') == ''
        run: python aegis/backtest.py && cp data/backtest.json state/backtest.json

      - name: Engine cycle
        run: |
          case "$ACTION" in evaluate|pause|resume|reset) A="$ACTION" ;; *) A=cycle ;; esac
          python aegis/cycle.py --action "$A"

      - name: Save state to the repo
        run: |
          git config user.name "aegis-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -q -m "engine: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          cp state/state.json state/backtest.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
